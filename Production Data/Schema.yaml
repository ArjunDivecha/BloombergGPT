openapi: 3.1.0
info:
  title: Bloomberg Data Broker - UNRESTRICTED
  version: 2.1.0
  description: >
    Bloomberg Data Broker - UNRESTRICTED.
    Any field allowed; field list driven by the curated master catalog.
servers:
  - url: https://broker.dancing-ganesh.com
    description: Bloomberg Data Broker via Cloudflare tunnel - UNRESTRICTED
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    FieldInfo:
      type: object
      properties:
        field:
          type: string
          description: Bloomberg display mnemonic (e.g., PX_LAST)
        field_id:
          type: string
          description: Bloomberg field ID (e.g., PR005)
        description:
          type: string
        data_type:
          type: string
        sampleValues:
          type: object
          additionalProperties: true
          description: >
            Sample values pulled from the curated catalog keyed by representative tickers
    SecurityInfo:
      type: object
      properties:
        security:
          type: string
          description: Bloomberg security identifier (e.g., BDIY Index)
        description:
          type: string
        yellowKey:
          type: string
          description: Bloomberg yellow key (classification)
    CoverageResponse:
      type: object
      properties:
        ticker:
          type: string
        covered:
          type: boolean
        message:
          type: string
        coverage_field:
          type: string
          description: Field used to verify coverage (display mnemonic)
        provenance:
          type: string
    ResolvedField:
      type: object
      properties:
        requested:
          type: string
          description: The field text supplied by the caller
        display_name:
          type: string
          description: Bloomberg display mnemonic
        field_id:
          type: string
        description:
          type: string
        data_type:
          type: string
    RefDataResponse:
      type: object
      properties:
        ticker:
          type: string
        fields:
          type: array
          items:
            type: string
          description: List of resolved Bloomberg field mnemonics (display names)
        resolved_fields:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedField'
        data:
          type: object
          additionalProperties: true
          description: Field/value map keyed by display mnemonic
        provenance:
          type: string
    HistoricalDataPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        values:
          type: object
          additionalProperties: true
          description: Field/value map for this date keyed by display mnemonic
    HistoricalResponse:
      type: object
      properties:
        ticker:
          type: string
        fields:
          type: array
          items:
            type: string
          description: Resolved Bloomberg field mnemonics
        resolved_fields:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedField'
        data:
          type: array
          items:
            $ref: '#/components/schemas/HistoricalDataPoint'
        provenance:
          type: string
paths:
  /blp/fields:
    get:
      operationId: getFields
      summary: List Bloomberg fields from the curated master catalog
      security:
        - ApiKeyAuth: []
      parameters:
        - name: contains
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive substring applied to mnemonic/description/category
        - name: regex
          in: query
          required: false
          schema:
            type: string
          description: Regular expression applied to mnemonic/description (case-insensitive)
        - name: terms
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: Tokens that must appear in results (see matchMode)
        - name: matchMode
          in: query
          required: false
          schema:
            type: string
            enum: [any, all]
            default: any
          description: Require any or all supplied terms
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          description: Maximum number of FieldInfo objects returned
      responses:
        '200':
          description: Catalog of allowed Bloomberg fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total number of fields matching the filter
                  returned:
                    type: integer
                    description: Number of FieldInfo objects included in this response
                  fields:
                    type: array
                    items:
                      $ref: '#/components/schemas/FieldInfo'
                  provenance:
                    type: string
  /blp/screen:
    get:
      operationId: runEquityScreen
      summary: Run Bloomberg Equity Screen (BEQS) - Run saved EQS screens
      security:
        - ApiKeyAuth: []
      parameters:
        - name: screen_name
          in: query
          required: true
          schema:
            type: string
          description: Name of saved Bloomberg EQS screen
        - name: screen_type
          in: query
          required: false
          schema:
            type: string
            enum: [PRIVATE, GLOBAL]
            default: PRIVATE
          description: PRIVATE (your saved screens) or GLOBAL (Bloomberg sample screens)
        - name: group
          in: query
          required: false
          schema:
            type: string
          description: >
            Folder/category for GLOBAL screens. Examples: "Popular", "Investment Banking"
            Required for most GLOBAL screens
        - name: language
          in: query
          required: false
          schema:
            type: string
            default: ENGLISH
          description: Language ID for screen results
        - name: asof_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Optional date (YYYY-MM-DD) for historical Point-in-Time screening
      responses:
        '200':
          description: Screen results retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  screen_name:
                    type: string
                  screen_type:
                    type: string
                  group:
                    type: string
                  asof_date:
                    type: string
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  provenance:
                    type: string
  /blp/securities:
    get:
      operationId: getSecurities
      summary: Search Bloomberg instruments (SECF-style)
      security:
        - ApiKeyAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Instrument search pattern (supports wildcards)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 15
          description: Maximum number of securities to include in the response
      responses:
        '200':
          description: Matching Bloomberg securities
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  total:
                    type: integer
                    description: Total number of matching securities after de-duplication
                  returned:
                    type: integer
                    description: Number of securities included in this response
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecurityInfo'
                  message:
                    type: string
                    description: Returned when no securities are available for the supplied query
                  provenance:
                    type: string
  /blp/coverage:
    get:
      operationId: getCoverage
      summary: Check Bloomberg coverage for a ticker
      security:
        - ApiKeyAuth: []
      parameters:
        - name: ticker
          in: query
          required: true
          schema:
            type: string
          description: Bloomberg ticker symbol (e.g., AAPL US Equity)
      responses:
        '200':
          description: Coverage status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageResponse'
  /blp/refdata:
    get:
      operationId: getRefData
      summary: Retrieve current reference data for one or more tickers (SUPPORTS BATCH REQUESTS)
      security:
        - ApiKeyAuth: []
      parameters:
        - name: ticker
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            minItems: 1
            maxItems: 100
          description: >
            One or more Bloomberg ticker symbols. BATCH SUPPORT: Pass multiple tickers to get
            data in ONE API call instead of making separate requests. 
            Example: ?ticker=AAPL&ticker=MSFT&ticker=GOOGL
            This is 10x more efficient than individual requests!
        - name: fields
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >
            Field names or phrases; each will be resolved to the curated Bloomberg
            display mnemonic (case-insensitive, friendly names supported)
      responses:
        '200':
          description: Reference data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefDataResponse'
  /blp/historical:
    get:
      operationId: getHistorical
      summary: Retrieve historical data for a ticker (unrestricted fields)
      security:
        - ApiKeyAuth: []
      parameters:
        - name: ticker
          in: query
          required: true
          schema:
            type: string
        - name: fields
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          description: >
            Field names or phrases; resolved to Bloomberg display mnemonics using the curated catalog
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: periodicity
          in: query
          required: false
          schema:
            type: string
            enum: [DAILY, WEEKLY, MONTHLY, QUARTERLY, YEARLY]
            default: DAILY
          description: Data frequency - auto-upgrades to MONTHLY for ranges > 2 years, QUARTERLY for > 10 years
        - name: max_data_points
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
          description: Maximum data points to return (prevents ChatGPT response size limits)
      responses:
        '200':
          description: Historical data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoricalResponse'
  /blp/bulkdata:
    get:
      operationId: getBulkData
      summary: Retrieve Bloomberg bulk/tabular data (BDS) - returns array/table results
      description: >
        Get Bloomberg bulk data fields that return tables/arrays instead of single values.
        Common use cases: dividend history, revenue by segment, major shareholders, earnings history, etc.
        This unlocks hundreds of Bloomberg fields that provide rich multi-row datasets.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: ticker
          in: query
          required: true
          schema:
            type: string
          description: Bloomberg ticker symbol (e.g., AAPL US Equity or just AAPL)
        - name: field
          in: query
          required: true
          schema:
            type: string
          description: >
            Bulk data field name. Common examples:
            DVD_HIST_ALL (dividend history), 
            PG_REVENUE (revenue by segment),
            TOP_20_HOLDERS_PUBLIC_FILINGS (major shareholders),
            EARN_ANN_DT_TIME_HIST_WITH_EPS (earnings history),
            CF_FREE_CASH_FLOW (free cash flow by period)
      responses:
        '200':
          description: Bulk data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticker:
                    type: string
                    description: Ticker that was queried
                  field:
                    type: string
                    description: Resolved Bloomberg field name
                  field_info:
                    $ref: '#/components/schemas/FieldInfo'
                  row_count:
                    type: integer
                    description: Number of rows returned in the bulk data table
                  data:
                    type: array
                    description: Array of objects, where each object represents one row of the table
                    items:
                      type: object
                      additionalProperties: true
                      description: Each row contains field-value pairs for that record
                  provenance:
                    type: string
                    description: Data source and retrieval timestamp
        '400':
          description: Bad request (e.g., field is not a bulk data field)
        '404':
          description: No bulk data returned for the specified field
        '503':
          description: Bloomberg API unavailable
  /blp/fields/search:
    get:
      operationId: searchFields
      summary: Search for Bloomberg fields by keyword using live Bloomberg field catalog
      description: >
        Dynamic field discovery using Bloomberg's Field Search service (//blp/apiflds).
        Search by keywords to find relevant fields - returns field mnemonics, descriptions,
        data types, and categories. This queries Bloomberg's live catalog in real-time.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Search keyword or phrase (e.g., 'dividend', 'earnings', 'market cap', 'P/E ratio')
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
          description: Maximum number of fields to return
      responses:
        '200':
          description: Field search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                    description: The search query that was executed
                  total_results:
                    type: integer
                    description: Number of fields returned
                  limit:
                    type: integer
                    description: Maximum results limit applied
                  results:
                    type: array
                    description: List of matching Bloomberg fields
                    items:
                      type: object
                      properties:
                        mnemonic:
                          type: string
                          description: Bloomberg field mnemonic (e.g., LAST_PRICE)
                        id:
                          type: string
                          description: Bloomberg field ID
                        description:
                          type: string
                          description: Human-readable field description
                        datatype:
                          type: string
                          description: Data type (String, Float, Int, Date, Boolean, Bulk, Sequence)
                        category:
                          type: string
                          description: Bloomberg category (e.g., Market Activity, Analysis)
                        field_type:
                          type: string
                          description: Field type (Static or RealTime)
                  provenance:
                    type: string
                    description: Data source and retrieval timestamp
        '503':
          description: Bloomberg API unavailable
  /blp/fields/info:
    get:
      operationId: getFieldInfo
      summary: Get detailed metadata for specific Bloomberg fields
      description: >
        Retrieve comprehensive information about one or more Bloomberg fields using FieldInfoRequest.
        Returns full documentation, data types, categories, available overrides, and usage information.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: fields
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated field mnemonics (e.g., 'LAST_PRICE,CUR_MKT_CAP,DVD_YILD')
      responses:
        '200':
          description: Field information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  fields:
                    type: array
                    description: List of requested field mnemonics
                    items:
                      type: string
                  results:
                    type: array
                    description: Detailed field information
                    items:
                      type: object
                      properties:
                        mnemonic:
                          type: string
                          description: Bloomberg field mnemonic
                        id:
                          type: string
                          description: Bloomberg field ID
                        description:
                          type: string
                          description: Field description
                        datatype:
                          type: string
                          description: Data type
                        category:
                          type: string
                          description: Bloomberg category
                        field_type:
                          type: string
                          description: Static or RealTime
                        documentation:
                          type: string
                          description: Full field documentation
                        overrides:
                          type: array
                          description: Available field overrides
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              description:
                                type: string
                        error:
                          type: string
                          description: Error message if field not found
                  provenance:
                    type: string
                    description: Data source and retrieval timestamp
        '400':
          description: Bad request (no valid fields provided)
        '503':
          description: Bloomberg API unavailable
  /blp/fields/list:
    get:
      operationId: listFields
      summary: Get complete Bloomberg field catalog by type
      description: >
        Retrieve Bloomberg's entire field catalog using FieldListRequest.
        Can filter by All, Static (reference data), or RealTime (market data) fields.
        Warning: This can return thousands of fields and may take time to complete.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: field_type
          in: query
          required: false
          schema:
            type: string
            enum: [All, Static, RealTime]
            default: All
          description: >
            Field type filter:
            'All' = All available fields,
            'Static' = Reference data fields (company info, fundamentals),
            'RealTime' = Real-time market data fields (prices, quotes)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
          description: Maximum number of fields to return
      responses:
        '200':
          description: Field list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  field_type:
                    type: string
                    description: The field type filter applied
                  total_returned:
                    type: integer
                    description: Number of fields returned
                  limit:
                    type: integer
                    description: Maximum results limit applied
                  note:
                    type: string
                    description: Note about result completeness
                  results:
                    type: array
                    description: List of Bloomberg fields
                    items:
                      type: object
                      properties:
                        mnemonic:
                          type: string
                        id:
                          type: string
                        description:
                          type: string
                        datatype:
                          type: string
                        category:
                          type: string
                        field_type:
                          type: string
                  provenance:
                    type: string
                    description: Data source and retrieval timestamp
        '400':
          description: Invalid field_type parameter
        '503':
          description: Bloomberg API unavailable
  /blp/snapshot:
    get:
      operationId: marketSnapshot
      summary: Get market snapshot with key metrics for multiple tickers
      description: >
        Returns pre-formatted market data perfect for instant display. Includes Price, Change%,
        Volume, Market Cap, P/E Ratio, and Dividend Yield for multiple tickers. Optimized for
        fast display - no ChatGPT processing needed. Much faster than individual field requests.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: tickers
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated tickers (e.g., AAPL,MSFT,GOOGL,AMZN)
      responses:
        '200':
          description: Market snapshot retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  table:
                    type: array
                    description: Pre-formatted table rows ready for display
                    items:
                      type: object
                      properties:
                        Ticker:
                          type: string
                        Price:
                          type: string
                        Change %:
                          type: string
                        Volume:
                          type: string
                        Market Cap:
                          type: string
                        P/E Ratio:
                          type: string
                        Div Yield:
                          type: string
                  batch_mode:
                    type: boolean
                    description: Whether batch mode was used
                  ticker_count:
                    type: integer
                    description: Number of tickers processed
                  field_count:
                    type: integer
                    description: Number of fields retrieved per ticker
                  timestamp:
                    type: string
                    format: date-time
                  provenance:
                    type: string
                    description: Data source and retrieval timestamp
        '400':
          description: No valid tickers provided
        '503':
          description: Bloomberg API unavailable
  /blp/compare:
    get:
      operationId: compareTickers
      summary: Compare multiple tickers on a single metric
      description: >
        Compare 2+ tickers on any metric (P/E Ratio, Dividend Yield, Market Cap, etc.).
        Returns both formatted table and chart-ready data for instant visualization.
        Much faster than getting data for each ticker separately and building comparisons.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: tickers
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated tickers to compare (e.g., AAPL,MSFT,GOOGL,AMZN)
        - name: metric
          in: query
          required: false
          schema:
            type: string
            default: PE_RATIO
          description: Metric to compare (e.g., PE_RATIO, DVD_YILD, CUR_MKT_CAP, PX_LAST)
      responses:
        '200':
          description: Ticker comparison retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  metric:
                    type: string
                    description: The metric being compared
                  table:
                    type: array
                    description: Pre-formatted comparison table
                    items:
                      type: object
                      properties:
                        Ticker:
                          type: string
                        PE_RATIO:
                          type: string
                  chart:
                    type: object
                    description: Chart-ready data for instant visualization
                    properties:
                      labels:
                        type: array
                        items:
                          type: string
                      values:
                        type: array
                        items:
                          type: number
                      colors:
                        type: array
                        items:
                          type: string
                  valid_count:
                    type: integer
                    description: Number of tickers with valid data
                  batch_mode:
                    type: boolean
                    description: Whether batch mode was used
                  timestamp:
                    type: string
                    format: date-time
                  provenance:
                    type: string
                    description: Data source and retrieval timestamp
        '400':
          description: At least 2 tickers required for comparison
        '503':
          description: Bloomberg API unavailable
  /blp/historical-stats:
    get:
      operationId: historicalStats
      summary: Get statistical summary of historical data
      description: >
        Returns statistical summary (min, max, avg, change%, volatility) instead of full dataset.
        Perfect for quick insights without overwhelming ChatGPT with hundreds of data points.
        Much faster than returning complete historical datasets.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: ticker
          in: query
          required: true
          schema:
            type: string
          description: Ticker symbol (e.g., AAPL)
        - name: field
          in: query
          required: true
          schema:
            type: string
          description: Field to analyze (e.g., PX_LAST, VOLUME, PE_RATIO)
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD). Defaults to today
      responses:
        '200':
          description: Historical statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticker:
                    type: string
                    description: Ticker symbol
                  field:
                    type: string
                    description: Field analyzed
                  period:
                    type: string
                    description: Date range analyzed
                  data_points:
                    type: integer
                    description: Number of data points analyzed
                  statistics:
                    type: object
                    description: Statistical summary
                    properties:
                      current:
                        type: number
                        description: Latest value
                      start:
                        type: number
                        description: Starting value
                      min:
                        type: number
                        description: Minimum value in period
                      max:
                        type: number
                        description: Maximum value in period
                      average:
                        type: number
                        description: Average value
                      change:
                        type: number
                        description: Absolute change (current - start)
                      change_pct:
                        type: number
                        description: Percentage change
                      volatility:
                        type: number
                        description: Price volatility as percentage
                  sample_data:
                    type: array
                    description: Sample data points (first 5 + last 5) for reference
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                        values:
                          type: object
                  timestamp:
                    type: string
                    format: date-time
                  provenance:
                    type: string
                    description: Data source and retrieval timestamp
        '404':
          description: No data available for the specified period
        '503':
          description: Bloomberg API unavailable
